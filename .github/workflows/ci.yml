name: CEAL CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and adversarial invariant tests
        env: {PYTHONPATH: src}
        run: python -m unittest discover -s tests -v
      - name: Validate task package
        env: {PYTHONPATH: src}
        run: python -m studioos_ceal validate-task templates/TASK_PACKAGE.example.json
      - name: Run >=8000 scenario stability matrix
        env: {PYTHONPATH: src}
        run: python -m studioos_ceal run --output-dir evidence --keep-matrix
      - name: Verify evidence manifest
        env: {PYTHONPATH: src}
        run: python -m studioos_ceal verify-manifest evidence/manifest.json
